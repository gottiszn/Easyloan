<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #0b5ed7;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #0b5ed7;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #084298;
    }

    #message {
        text-align: center;
        margin-top: 18px;
        font-weight: bold;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #0b5ed7;
        text-decoration: none;
    }
</style>
<div class="container">

    <h1>Create Account</h1>

    <p class="subtitle">
        Register for your EasyLoan account
    </p>

    <form id="registerForm">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">Create Account</button>

    </form>

    <div id="message"></div>

    <a href="/" class="back">← Back to EasyLoan</a>

</div>


<script>
    document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const message = document.getElementById("message");

            try {

                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                message.textContent = data.message;

                if (response.ok) {
                    message.style.color = "green";
                    document.getElementById("registerForm").reset();
                } else {
                    message.style.color = "red";
                }

            } catch (error) {

                message.textContent = "Unable to connect to server.";
                message.style.color = "red";

            }

        });
</script>
