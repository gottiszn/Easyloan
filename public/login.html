<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport"content="width=device-width, initial-scale=1.0"> 
        <title>EasyLoan - Login</title> 
        <style> 
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f6f9; } 
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-top: 0; color: #333; } 
        input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; } 
        button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1d4ed8; }
        .msg { margin-top: 12px; font-size: 14px; text-align: center; } 
        </style> 
        </head> 
        <body> 
            <div class="card"> 
                <h2>Login to EasyLoan</h2> 
                <form id="loginForm"> 
                    <label>Email</label> 
                    <input type="email" id="email" required>
                    <label>Password</label> 
                    <input type="password" id="password" required> 
                    <button type="submit">Sign In</button>
                    </form> 
                    <div id="message" class="msg"></div> 
                    </div> 
                    <script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // 1. Grab the text from the inputs
    const emailInput = document.getElementById("email").value;
    const passwordInput = document.getElementById("password").value;

    // 2. Send the clean values to the server
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        email: emailInput, 
        password: passwordInput 
      })
    });

    const data = await response.json();

    if (response.ok) {
      alert("Login successful!");
      console.log("Logged in user:", data.user);
    } else {
      document.getElementById("errorMessage").innerText = data.message;
    }
  });
</script> 
                                                </body> 
                                                </html>
